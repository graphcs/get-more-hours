name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # next build does not need live credentials, but modules read these at
      # import time. Placeholders keep the build hermetic and secret-free.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      OPENROUTER_API_KEY: placeholder-openrouter-key
      STRIPE_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    env:
      PREVIEW_URL: ${{ secrets.PREVIEW_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Check for a preview URL
        id: preview
        run: |
          if [ -n "${PREVIEW_URL}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E skipped::PREVIEW_URL is not set; skipping Playwright E2E."
          fi

      # Everything below is a no-op when PREVIEW_URL is absent, so the job
      # succeeds rather than failing the PR just because no preview exists.
      - uses: actions/setup-node@v4
        if: steps.preview.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.preview.outputs.available == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.preview.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E against the preview deployment
        if: steps.preview.outputs.available == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always() && steps.preview.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
